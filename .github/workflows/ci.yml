name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the sampler image
        run:
          docker build -t sampler:${{ github.sha }} sampler/
      - name: Show some context values
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'sampler:${{ github.sha }}'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: 1
          version: v0.75.0