name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the sampler image
        run:
          docker build -t sampler:${{ github.sha }} sampler/
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'sampler:${{ github.sha }}'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: 1
          version: v0.75.0
      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f        #v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the docker image
        if: github.event_name == 'push'
        run: |
          IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}/sampler
          docker tag sampler:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}