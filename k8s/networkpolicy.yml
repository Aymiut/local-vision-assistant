# Policy 1: no pod in the namespace may open any outgoing connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}        # {} = all pods of the namespace
  policyTypes:
    - Egress             # no egress block, everything is denied
---
# Policy 2: the only exceptions, for the sampler alone. Policies add up: a pod may send
# whatever at least one policy that selects it allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sampler-egress
spec:
  podSelector:
    matchLabels:
      app: sampler
  policyTypes:
    - Egress
  egress:
    # DNS: the sampler connects by name (mediamtx, host.docker.internal), resolved by CoreDNS.
    # One item with both selectors = AND: the kube-dns pods of kube-system, nothing else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MediaMTX, to read the stream.
    - to:
        - podSelector:
            matchLabels:
              app: media
      ports:
        - protocol: TCP
          port: 8554
    # The API on the Mac: not a pod, so it's targeted by IP. 192.168.65.254 is what
    # host.docker.internal resolves to from inside a pod with Docker Desktop.
    - to:
        - ipBlock:
            cidr: 192.168.65.254/32
      ports:
        - protocol: TCP
          port: 8000
